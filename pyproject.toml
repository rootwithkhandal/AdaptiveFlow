[project]
name = "adaptiveflow"
version = "0.1.0"
description = "AdaptiveFlow — adapts to every prompt. Production-grade adaptive LLM router with reinforcement learning, prompt complexity scoring, persona priors, and circuit breakers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AdaptiveFlow Contributors" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "litellm>=1.40.0",
    "redis>=5.0.4",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "prometheus-client>=0.20.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "httpx>=0.27.0",
    "numpy>=1.26.4",
    "structlog>=24.1.0",
]


[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
